name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The package ships the compiled CLI, so the build, the tarball contents, and a smoke run of dist/cli.js are checked on every push.
      - run: npm run build
      - run: npm pack --dry-run
      - name: Smoke-test the compiled CLI against the fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/cli-fixture"
          bash test/fixtures/make-fixture-repo.sh "$fixture"
          version="$(node dist/cli.js version --github-repository HagiCode-org/hagi-release-drafter "$fixture")"
          test "$version" = "2.0.0"
          node dist/cli.js notes --github-repository HagiCode-org/hagi-release-drafter "$fixture" > "$RUNNER_TEMP/cli-notes.md"
          # The base is the newest reachable release tag (v1.1.0-beta.1), so only the one breaking commit after it is listed.
          grep -qxF "### Breaking Changes" "$RUNNER_TEMP/cli-notes.md"
          for heading in "### Features" "### Fixes" "### Documentation" "### Maintenance"; do
            if grep -qxF "$heading" "$RUNNER_TEMP/cli-notes.md"; then
              echo "::error::$heading must be absent: its commits precede the base tag."
              exit 1
            fi
          done
          echo "CLI smoke test passed: version $version."

  self-test:
    runs-on: ubuntu-latest
    steps:
      # The action is checked out beside the fixture so that the fixture can become the
      # workspace root. Composite steps always run in the workspace root.
      - name: Check out the action
        uses: actions/checkout@v6
        with:
          path: action
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Build the fixture repository in the workspace
        shell: bash
        run: bash action/test/fixtures/make-fixture-repo.sh "$GITHUB_WORKSPACE"

      # The stub gh answers read calls and records writes. The draft step therefore runs
      # for real but cannot create or edit a release, and the read-only token is enough.
      - name: Put the stub gh first on PATH
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/action/test/fixtures/stub-gh" >> "$GITHUB_PATH"
          echo "STUB_GH_LOG=$RUNNER_TEMP/gh-calls.log" >> "$GITHUB_ENV"

      - name: Run the action against the fixture
        id: drafter
        uses: ./action
        with:
          github-token: ${{ github.token }}

      - name: Assert version, tag, and notes
        shell: bash
        env:
          EXPECTED_VERSION: '2.0.0'
          ACTUAL_VERSION: ${{ steps.drafter.outputs.version }}
          ACTUAL_TAG: ${{ steps.drafter.outputs.tag }}
          NOTES_FILE: ${{ steps.drafter.outputs.notes-file }}
        run: |
          set -euo pipefail
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          test "$ACTUAL_TAG" = "v$EXPECTED_VERSION"
          # The base is the newest reachable release tag (v1.1.0-beta.1), so only the one breaking commit after it is listed.
          grep -qxF "### Breaking Changes" "$NOTES_FILE"
          for heading in "### Features" "### Fixes" "### Documentation" "### Maintenance"; do
            if grep -qxF "$heading" "$NOTES_FILE"; then
              echo "::error::$heading must be absent: its commits precede the base tag."
              exit 1
            fi
          done
          # The stub separates arguments with \x1f; convert them to spaces before matching.
          calls="$(tr '\037' ' ' < "$RUNNER_TEMP/gh-calls.log")"
          case "$calls" in
            *"release create v$EXPECTED_VERSION --draft "*) ;;
            *)
              echo "::error::Expected the draft to be created through gh release create --draft."
              exit 1
              ;;
          esac
          echo "Self-test passed: version $ACTUAL_VERSION, tag $ACTUAL_TAG, draft created through the stub."
